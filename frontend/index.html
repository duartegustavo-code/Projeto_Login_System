<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login System</title>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="login-conteiner">
    <!-- div principal de login, a class "login-cointeiner é usado no CSS" -->

    <h1>Login</h1>

    <p>Acesse sua conta</p>

    <form>
        <div class="input-group">
        <!-- a div que agrupa a label(título) e o input -->
             <label for="email">Email</label>
             <!-- texto que descreve o nosso campo -->
              <input id="email" type="email" placeholder="Digite seu email">
            <!-- placeholder, mostra ao usuário uma instrução dentro do campo de preenchimento -->
             <label for="senha">Senha</label>
             <input id="senha" type="password" placeholder="Digite sua Senha">

             <button type="submit">Entrar</button>
        </div>
    </form>

    <div class="footer">
        <span>Não tem conta?</span>
        <a href="#">Criar conta</a>
    </div>

    </div>
</body>
</html>
